# ============================================================
#  docker-compose.yml  —  Bot C++ + accès dashboard
# ============================================================
services:

  # ── Bot C++ (image runtime Release, testée au build) ──
  swing_bot:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: runtime
    container_name: swing_bot
    # Le CP Gateway écoute sur https://localhost:5000 de l'HÔTE : sans
    # network_mode: host, « localhost » dans le conteneur ne l'atteint
    # jamais. Le port 9001 (WsServer) est exposé directement — pas de
    # mapping ports: (invalide avec host).
    network_mode: host
    # Secrets d'alerte (SWINGBOT_*) — copier .env.example vers .env et
    # remplir ; .env est ignoré par git, ne JAMAIS committer de valeurs.
    # required: false → démarre aussi sans .env (canaux d'alerte désactivés,
    # le gate live refusera alors --live).
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data  # les DB (data/swingbot_ibkr*.db) persistées sur l'hôte
    # SANS RISQUE pour le mode live : le gate exige un TTY + « OUI » tapé —
    # un restart automatique ne peut relancer que le mode paper.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"   # post-mortem possible : logs persistés avec rotation
        max-file: "5"

  # ── Tests (s'arrête après exécution) ──────────────────
  # Le stage `builder` n'existe que dans Dockerfile.multistage — le
  # Dockerfile par défaut est monolithique (docker compose --profile test
  # échouait avec « target builder not found »).
  unit_tests:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: builder     # stage intermédiaire avec les binaires de test
    container_name: unit_tests
    command: ./build/unit_tests --gtest_color=yes
    profiles: ["test"]    # lancé seulement avec --profile test

  integration_tests:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: builder
    container_name: integration_tests
    command: ./build/integration_tests --gtest_color=yes
    profiles: ["test"]
